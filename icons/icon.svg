<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="114" fill="#42281A"/>
  <!-- マスクされる端末でも欠けないよう、絵は内側に収める -->
  <g transform="translate(256 256) scale(.9) translate(-256 -256)">
    <!-- 上のふくらみ＝ドリッパーの円錐。中は湯で満たす -->
    <path d="M146 152 L366 152 L269 271 L243 271 Z" fill="#C87A41"/>
    <!-- 下は空で、一滴が落ちてくるだけ -->
    <path d="M256 274 c -16 21 -21 30 -21 38 a 21 21 0 0 0 42 0 c 0 -8 -5 -17 -21 -38 Z" fill="#F2E7DA"/>
    <!-- 砂時計の輪郭 -->
    <path d="M132 140 L380 140 L279 250 L279 272 L380 382 L132 382 L233 272 L233 250 Z"
          fill="none" stroke="#F2E7DA" stroke-width="19" stroke-linejoin="round"/>
    <!-- 枠板 -->
    <g fill="#F2E7DA">
      <rect x="104" y="96" width="304" height="30" rx="15"/>
      <rect x="104" y="392" width="304" height="30" rx="15"/>
    </g>
  </g>
</svg>
